scope: pg-cluster
name: pg-dc1

restapi:
  listen: 0.0.0.0:8008
  connect_address: ${DC1_IP}:8008

# Built-in Raft DCS — no external etcd/ZooKeeper needed.
# Port 5010 must be open between DC1 and DC2.
raft:
  self_addr: 172.30.0.10:5010
  partner_addrs:
    - 172.30.0.20:5010
    - 172.30.0.30:5010
  data_dir: /home/postgres/raft

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: false
    postgresql:
      use_pg_rewind: true
      failsafe_mode: true
      check_timeline: true
      use_slots: true
      parameters:
        wal_level: replica
        wal_log_hints: on
        max_wal_senders: 5
        max_replication_slots: 5
        hot_standby: on
        hot_standby_feedback: on
        wal_keep_size: 1024MB
        # archive_mode and archive_command are disabled until pgbackrest
        # is installed and configured (Phase 7). Enable them then.
        archive_mode: 'off'
        archive_command: 'true'

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ${DC1_IP}:5432
  data_dir: /home/postgres/data
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: ${PATRONI_REPLICATION_PASSWORD}
    superuser:
      username: postgres
      password: ${PATRONI_SUPERUSER_PASSWORD}

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

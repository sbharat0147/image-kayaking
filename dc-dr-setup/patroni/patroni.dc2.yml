scope: pg-cluster
name: pg-dc2

restapi:
  listen: 0.0.0.0:8008
  connect_address: ${PATRONI_CONNECT_IP}:8008

raft:
  self_addr: ${DC2_IP}:5010
  partner_addrs:
    - ${DC1_IP}:5010
  data_dir: /home/postgres/raft

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: false
    postgresql:
      use_pg_rewind: true
      failsafe_mode: true
      check_timeline: true
      use_slots: true
      parameters:
        wal_level: replica
        wal_log_hints: on
        max_wal_senders: 5
        max_replication_slots: 5
        hot_standby: on
        hot_standby_feedback: on
        wal_keep_size: 1024MB
        archive_mode: 'off'
        archive_command: 'true'

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ${PATRONI_CONNECT_IP}:5432
  data_dir: /home/postgres/data
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: ${PATRONI_REPLICATION_PASSWORD}
    superuser:
      username: postgres
      password: ${PATRONI_SUPERUSER_PASSWORD}

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

scope: pg-cluster
name: pg-witness

restapi:
  listen: 0.0.0.0:8008
  connect_address: ${DC1_IP}:8010

# 3rd Raft voter — provides quorum when either DC1 or DC2 is down.
# Knows about both DC1 (5010) and DC2 (5011) so it can join the cluster.
raft:
  self_addr: ${DC1_IP}:5012
  partner_addrs:
    - ${DC1_IP}:5010
    - ${DC1_IP}:5011
  data_dir: /home/postgres/raft

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: false
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        wal_log_hints: on
        max_wal_senders: 5
        max_replication_slots: 5
        hot_standby: on
        hot_standby_feedback: on
        wal_keep_size: 128MB
        archive_mode: 'off'
        archive_command: 'true'

postgresql:
  listen: 0.0.0.0:5432
  connect_address: ${DC1_IP}:5434
  data_dir: /home/postgres/data
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: ${PATRONI_REPLICATION_PASSWORD}
    superuser:
      username: postgres
      password: ${PATRONI_SUPERUSER_PASSWORD}

# Witness never becomes primary — only provides Raft quorum vote.
tags:
  nofailover: true
  noloadbalance: true
  clonefrom: false
  nosync: false

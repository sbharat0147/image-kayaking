# Shared postgresql.conf — tuning applied on top of Patroni-managed settings.
# Patroni will override wal_level, archive_*, hot_standby via DCS config.

# Connections
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Checkpoints
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 80MB
max_wal_size = 1GB

# Replication
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 128MB
hot_standby = on
hot_standby_feedback = on   # prevent vacuum cancelling queries on replica

# Logging
log_min_duration_statement = 1000   # log queries > 1 s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on

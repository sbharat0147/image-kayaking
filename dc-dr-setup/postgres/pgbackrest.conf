[global]
# Repository is MinIO (S3-compatible) on DC1; DC2 gets a copy via site replication
repo1-type=s3
repo1-s3-endpoint=${DC1_IP}:9000
repo1-s3-bucket=pgbackrest-archive
repo1-s3-key=${PGBACKREST_REPO_S3_KEY}
repo1-s3-key-secret=${PGBACKREST_REPO_S3_KEY_SECRET}
repo1-s3-region=us-east-1    # MinIO ignores this but pgBackRest requires it
repo1-s3-uri-style=path
repo1-s3-verify-tls=n        # set y once you have proper TLS on MinIO

# Retention: keep 2 full backups + 7 days of WAL
repo1-retention-full=2
repo1-retention-diff=7

# Compression
compress-type=lz4
compress-level=3

# Logging
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[main]
pg1-path=/home/postgres/data
pg1-port=5432
pg1-user=postgres

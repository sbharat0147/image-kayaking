version: "3.9"

# DC1 (Primary) stack
# Run: docker compose -f docker-compose.dc1.yml --env-file .env up -d

networks:
  dc-internal:
    driver: bridge

volumes:
  pg_data_dc1:
  minio_data_dc1:
  etcd_data_dc1:
  prometheus_data:
  grafana_data:

services:

  # ── etcd ─────────────────────────────────────────────────────────────────
  etcd:
    image: bitnami/etcd:3.5
    container_name: etcd-dc1
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data_dc1:/bitnami/etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_NAME: etcd-dc1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://${DC1_IP}:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://${DC1_IP}:2379
      ETCD_INITIAL_CLUSTER: etcd-dc1=http://${DC1_IP}:2380,etcd-dc2=http://${DC2_IP}:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: pg-cluster-token

  # ── PostgreSQL + Patroni ──────────────────────────────────────────────────
  postgres-patroni:
    image: patroni/patroni:3.3.0
    container_name: postgres-dc1
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "5432:5432"
      - "8008:8008"   # Patroni REST API
    volumes:
      - pg_data_dc1:/home/postgres/data
      - ./patroni/patroni.dc1.yml:/etc/patroni/patroni.yml:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    environment:
      PATRONI_NAME: pg-dc1
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/data
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD}
      PATRONI_ETCD_HOSTS: ${DC1_IP}:2379,${DC2_IP}:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${DC1_IP}:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${DC1_IP}:5432
    depends_on:
      - etcd

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: minio-dc1
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data_dc1:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_NAME: dc1
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  # ── Alertmanager ─────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "9093:9093"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: grafana
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

  # ── postgres_exporter ─────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${PATRONI_SUPERUSER_PASSWORD}@postgres-dc1:5432/postgres?sslmode=disable"
    depends_on:
      - postgres-patroni

# DC2 (DR / Replica) — LOCAL TEST MODE
# Runs on the same VM as DC1 using offset ports.
#
# Port mapping (host → container):
#   5433 → 5432  PostgreSQL
#   8009 → 8008  Patroni REST API
#   9002 → 9000  MinIO S3 API
#   9003 → 9001  MinIO Console
#
# Witness (3rd Raft voter):
#   5434 → 5432  PostgreSQL
#   8010 → 8008  Patroni REST API
#
# Raft uses the shared patroni-cluster Docker network with container names —
# no host-IP hairpin NAT involved.
#
# Run: docker compose -p dc2 -f docker-compose.dc2-local.yml --env-file .env up -d

networks:
  dc2-internal:
    driver: bridge
  # Must match the network created by the DC1 compose file.
  patroni-cluster:
    external: true
    name: patroni-cluster

volumes:
  pg_data_dc2:
  pg_raft_dc2:
  minio_data_dc2:
  pg_data_witness:
  pg_raft_witness:

services:

  # ── PostgreSQL + Patroni (DC2 replica) ────────────────────────────────────
  postgres-patroni:
    image: local/patroni:3.3.0
    container_name: postgres-dc2
    restart: unless-stopped
    networks:
      dc2-internal:
      patroni-cluster:
        ipv4_address: 172.30.0.20
    ports:
      - "5433:5432"   # PG (offset from DC1's 5432)
      - "8009:8008"   # Patroni REST API
    volumes:
      - pg_data_dc2:/home/postgres/data
      - pg_raft_dc2:/home/postgres/raft
      - ./patroni/patroni.dc2-local.yml:/etc/patroni/patroni.yml:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    environment:
      PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD}
      DC1_IP: ${DC1_IP}
      DC2_IP: ${DC1_IP}
      PATRONI_CONNECT_IP: 172.30.0.20

  # ── Raft Witness — 3rd voter for quorum (nofailover, noloadbalance) ───────
  postgres-witness:
    image: local/patroni:3.3.0
    container_name: postgres-witness
    restart: unless-stopped
    networks:
      dc2-internal:
      patroni-cluster:
        ipv4_address: 172.30.0.30
    ports:
      - "5434:5432"   # PG (witness, not for app traffic)
      - "8010:8008"   # Patroni REST API
    volumes:
      - pg_data_witness:/home/postgres/data
      - pg_raft_witness:/home/postgres/raft
      - ./patroni/patroni.witness-local.yml:/etc/patroni/patroni.yml:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    environment:
      PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD}
      DC1_IP: ${DC1_IP}
      DC2_IP: ${DC1_IP}
      PATRONI_CONNECT_IP: 172.30.0.30

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: minio-dc2
    restart: unless-stopped
    networks: [dc2-internal]
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data_dc2:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_NAME: dc2
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

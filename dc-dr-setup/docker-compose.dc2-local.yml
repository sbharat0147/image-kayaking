version: "3.9"

# DC2 (DR / Replica) — LOCAL TEST MODE
# Runs on the same VM as DC1 using offset ports.
# DC1_IP must be set to this VM's host IP in .env (same as DC1).
#
# Port mapping (host → container):
#   5433 → 5432  PostgreSQL
#   8009 → 8008  Patroni REST API
#   5011 → 5010  Patroni Raft peer
#   9002 → 9000  MinIO S3 API
#   9003 → 9001  MinIO Console
#
# Run: docker compose -f docker-compose.dc2-local.yml --env-file .env up -d

networks:
  dc2-internal:
    driver: bridge

volumes:
  pg_data_dc2:
  pg_raft_dc2:
  minio_data_dc2:

services:

  # ── PostgreSQL + Patroni ──────────────────────────────────────────────────
  postgres-patroni:
    image: local/patroni:3.3.0
    container_name: postgres-dc2
    restart: unless-stopped
    networks: [dc2-internal]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5433:5432"   # PG (offset from DC1's 5432)
      - "8009:8008"   # Patroni REST API (offset from 8008)
      - "5011:5010"   # Raft peer port (offset from 5010)
    volumes:
      - pg_data_dc2:/home/postgres/data
      - pg_raft_dc2:/home/postgres/raft
      - ./patroni/patroni.dc2-local.yml:/etc/patroni/patroni.yml:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    environment:
      PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD}
      DC1_IP: ${DC1_IP}
      DC2_IP: ${DC1_IP}

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: minio-dc2
    restart: unless-stopped
    networks: [dc2-internal]
    ports:
      - "9002:9000"   # S3 API (offset from DC1's 9000)
      - "9003:9001"   # Console (offset from DC1's 9001)
    volumes:
      - minio_data_dc2:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_NAME: dc2
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

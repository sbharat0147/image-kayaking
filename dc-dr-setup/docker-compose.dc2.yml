version: "3.9"

# DC2 (DR / Replica) stack
# Run: docker compose -f docker-compose.dc2.yml --env-file .env up -d

networks:
  dc-internal:
    driver: bridge

volumes:
  pg_data_dc2:
  minio_data_dc2:
  etcd_data_dc2:

services:

  # ── etcd ─────────────────────────────────────────────────────────────────
  etcd:
    image: bitnami/etcd:3.5
    container_name: etcd-dc2
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data_dc2:/bitnami/etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_NAME: etcd-dc2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://${DC2_IP}:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://${DC2_IP}:2379
      ETCD_INITIAL_CLUSTER: etcd-dc1=http://${DC1_IP}:2380,etcd-dc2=http://${DC2_IP}:2380
      ETCD_INITIAL_CLUSTER_STATE: existing
      ETCD_INITIAL_CLUSTER_TOKEN: pg-cluster-token

  # ── PostgreSQL + Patroni ──────────────────────────────────────────────────
  postgres-patroni:
    image: patroni/patroni:3.3.0
    container_name: postgres-dc2
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "5432:5432"
      - "8008:8008"
    volumes:
      - pg_data_dc2:/home/postgres/data
      - ./patroni/patroni.dc2.yml:/etc/patroni/patroni.yml:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    environment:
      PATRONI_NAME: pg-dc2
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/data
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER}
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD}
      PATRONI_ETCD_HOSTS: ${DC1_IP}:2379,${DC2_IP}:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${DC2_IP}:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${DC2_IP}:5432
    depends_on:
      - etcd

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: minio-dc2
    restart: unless-stopped
    networks: [dc-internal]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dc2:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_NAME: dc2
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

groups:

  # ── Patroni / PostgreSQL HA ────────────────────────────────────────────────
  - name: patroni
    rules:
      - alert: PatroniNoLeader
        expr: sum(patroni_master) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "No Patroni leader in cluster"
          description: "patroni_master == 0 on all nodes. Manual intervention required."

      - alert: PatroniDemoted
        expr: patroni_master{dc="dc1"} == 0 and patroni_replica{dc="dc1"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "DC1 Patroni node is a replica (may have been demoted)"
          description: "DC1 lost primary role. DC2 may now be primary."

  # ── Replication ────────────────────────────────────────────────────────────
  - name: replication
    rules:
      - alert: ReplicaLagHigh
        expr: pg_replication_lag > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PG replication lag high ({{ $value | humanizeDuration }})"
          description: "DC={{ $labels.dc }} replication lag exceeds 30s. DR recovery point may be at risk."

      - alert: ReplicaLagCritical
        expr: pg_replication_lag > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PG replication lag CRITICAL ({{ $value | humanizeDuration }})"
          description: "DC={{ $labels.dc }} lag > 2 min. RPO breach imminent."

      - alert: ReplicaDown
        expr: absent(pg_replication_lag{dc="dc1"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "postgres_exporter on DC1 is not reporting"
          description: "Cannot determine replication state. Check postgres-exporter and postgres-dc1."

  # ── PostgreSQL health ──────────────────────────────────────────────────────
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down ({{ $labels.dc }})"
          description: "postgres_exporter cannot connect to PostgreSQL."

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PG connection count ({{ $value }})"
          description: "Connection pool may be exhausted. Consider pgBouncer."

  # ── MinIO ──────────────────────────────────────────────────────────────────
  - name: minio
    rules:
      - alert: MinIODown
        expr: absent(minio_cluster_health_status)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MinIO instance unreachable ({{ $labels.dc }})"
          description: "Prometheus cannot scrape MinIO metrics. Object storage may be down."

      - alert: MinIOReplicationErrors
        expr: increase(minio_replication_failed_count[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MinIO replication failures on {{ $labels.dc }}"
          description: "{{ $value }} replication failures in last 5 min. Check site replication status."

      - alert: MinIODiskUsageHigh
        expr: (minio_node_disk_used_bytes / minio_node_disk_total_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MinIO disk usage > 85% on {{ $labels.dc }}"
          description: "Disk at {{ $value | humanizePercentage }}. Add capacity or clean up buckets."

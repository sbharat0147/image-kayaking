global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: pg-cluster
    site: dc1

rule_files:
  - /etc/prometheus/alerting-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:

  # ── Patroni REST API ───────────────────────────────────────────────────────
  # Exposes: patroni_master, patroni_replica, patroni_xlog_location, etc.
  - job_name: patroni
    scrape_interval: 10s
    static_configs:
      - targets: ["postgres-dc1:8008"]
        labels:
          dc: dc1
          role: patroni

  # ── postgres_exporter ──────────────────────────────────────────────────────
  # Exposes: pg_replication_lag, pg_stat_user_tables, pg_up, etc.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          dc: dc1

  # ── MinIO cluster metrics ──────────────────────────────────────────────────
  - job_name: minio-dc1
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio-dc1:9000"]
        labels:
          dc: dc1

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: pg-cluster
    site: dc1

rule_files:
  - /etc/prometheus/alerting-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:

  # ── Patroni REST API — DC1 ────────────────────────────────────────────────
  - job_name: patroni
    scrape_interval: 10s
    static_configs:
      - targets: ["postgres-dc1:8008"]
        labels:
          dc: dc1
          node: pg-dc1

  # ── Patroni REST API — DC2 ────────────────────────────────────────────────
  - job_name: patroni-dc2
    scrape_interval: 10s
    static_configs:
      - targets: ["postgres-dc2:8008"]
        labels:
          dc: dc2
          node: pg-dc2

  # ── Patroni REST API — Witness ────────────────────────────────────────────
  - job_name: patroni-witness
    scrape_interval: 10s
    static_configs:
      - targets: ["postgres-witness:8008"]
        labels:
          dc: dc1
          node: pg-witness

  # ── postgres_exporter ─────────────────────────────────────────────────────
  # Exposes: pg_replication_lag_seconds, pg_database_size_bytes, pg_locks_count, etc.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          dc: dc1
          node: pg-dc1

  # ── MinIO cluster metrics — DC1 ───────────────────────────────────────────
  - job_name: minio-dc1
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio-dc1:9000"]
        labels:
          dc: dc1
          site: minio-dc1

  # ── MinIO cluster metrics — DC2 ───────────────────────────────────────────
  - job_name: minio-dc2
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio-dc2:9000"]
        labels:
          dc: dc2
          site: minio-dc2

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

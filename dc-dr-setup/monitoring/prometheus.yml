global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: postgres-dc1
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          dc: dc1

  # Add a second postgres_exporter on DC2 for full visibility
  - job_name: postgres-dc2
    static_configs:
      - targets: ["${DC2_IP}:9187"]
        labels:
          dc: dc2

  - job_name: minio-dc1
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio-dc1:9000"]
        labels:
          dc: dc1

  - job_name: minio-dc2
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["${DC2_IP}:9000"]
        labels:
          dc: dc2

  - job_name: patroni
    static_configs:
      - targets: ["postgres-dc1:8008", "${DC2_IP}:8008"]

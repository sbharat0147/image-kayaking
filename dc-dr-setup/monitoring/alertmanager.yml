route:
  receiver: default
  group_by: [alertname, dc, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h

  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 15m

receivers:
  - name: default
    # Add webhook / email / Slack here for production
    # Example webhook:
    # webhook_configs:
    #   - url: http://your-webhook-endpoint/alerts

  - name: critical
    # Example Slack:
    # slack_configs:
    #   - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    #     channel: '#alerts'
    #     title: '[CRITICAL] {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, dc]

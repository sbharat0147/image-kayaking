# Development override — adds live code mounts and uvicorn --reload.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Changes take effect immediately on file save; no rebuild needed.
# Only the Python source and tool definitions are mounted; the
# pre-downloaded model weights stay inside the image.

services:

  notes-service:
    volumes:
      - ./sample-services/notes-service/main.py:/app/main.py:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  search-service:
    volumes:
      - ./sample-services/search-service/main.py:/app/main.py:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  mcp-server:
    volumes:
      - ./app:/app/app:ro
      - ./tools:/app/tools:ro
    environment:
      DEBUG: "true"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --reload
      --reload-dir /app/app
      --reload-dir /app/tools

networks:
  mcp-net:
    driver: bridge

services:

  # ── Sample upstream FastAPI services ─────────────────────────────────────
  notes-service:
    build:
      context: ./sample-services/notes-service
    container_name: notes-service
    restart: unless-stopped
    networks: [mcp-net]
    ports:
      - "8001:8000"

  search-service:
    build:
      context: ./sample-services/search-service
    container_name: search-service
    restart: unless-stopped
    networks: [mcp-net]
    ports:
      - "8002:8000"

  # ── MCP Server ────────────────────────────────────────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/mcp-server:1.0.0
    container_name: mcp-server
    restart: unless-stopped
    networks: [mcp-net]
    ports:
      - "8080:8080"
    environment:
      API_KEY: ${API_KEY:-changeme-mcp-api-key}
      UPSTREAM_SERVICES: "http://notes-service:8000,http://search-service:8000"
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      VLLM_URL: ${VLLM_URL:-http://host.docker.internal:8000}
      LLM_DEFAULT_BACKEND: ${LLM_DEFAULT_BACKEND:-ollama}
      DEBUG: ${DEBUG:-false}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      SENTENCE_TRANSFORMERS_HOME: /app/models
    depends_on:
      - notes-service
      - search-service
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./tools:/app/tools:ro
